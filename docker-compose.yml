services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 + PostGIS 3.4 Spatial Database
  # ---------------------------------------------------------------------------
  db:
    image: postgis/postgis:16-3.4
    container_name: disaster_safety_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-disaster_safety}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-replace_with_your_local_password}
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-disaster_safety}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # FastAPI Production ASGI Application
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: disaster_safety_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-disaster_safety}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-replace_with_your_local_password}
      DB_POOL_SIZE: 10
      DB_MAX_OVERFLOW: 20
      DB_ECHO: "false"
      OSRM_BASE_URL: ${OSRM_BASE_URL:-http://router.project-osrm.org}
      OSRM_TIMEOUT_SECONDS: "5.0"
      ALERT_MONITORING_ENABLED: ${ALERT_MONITORING_ENABLED:-true}
      ALERT_MONITORING_INTERVAL_SECONDS: ${ALERT_MONITORING_INTERVAL_SECONDS:-300}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MINUTE: "120"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgis_data:
    name: disaster_safety_postgis_data
